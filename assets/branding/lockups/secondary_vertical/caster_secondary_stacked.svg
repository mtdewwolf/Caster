<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" rx="32" fill="#0B0F19" />
  <defs>
    <linearGradient id="stackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="stackGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Centered Logomark -->
  <g transform="translate(125, 45)">
    <rect width="150" height="150" rx="36" fill="#111827" stroke="#1F2937" stroke-width="2.5" />
    <g filter="url(#stackGlow)">
      <path d="M 48 112 A 64 64 0 0 1 112 48" fill="none" stroke="url(#stackGrad)" stroke-width="12" stroke-linecap="round" />
      <path d="M 64 62 L 108 86 L 64 110 Z" fill="url(#stackGrad)" />
      <circle cx="48" cy="112" r="9" fill="#38BDF8" />
    </g>
  </g>

  <!-- Centered Wordmark & Subtitle -->
  <text x="200" y="275" fill="#F8FAFC" font-family="'Inter', -apple-system, system-ui, sans-serif" font-weight="900" font-size="46" text-anchor="middle" letter-spacing="-1">CASTER</text>
  <text x="200" y="315" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle" letter-spacing="3.5">PERSONAL MEDIA SERVER</text>
  
  <rect x="165" y="338" width="70" height="24" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" />
  <text x="200" y="354" fill="#38BDF8" font-family="'Inter', monospace, sans-serif" font-weight="800" font-size="11" text-anchor="middle" letter-spacing="2">NAS</text>
</svg>
