<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="symGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="symGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#symGlow)">
    <!-- Outer Arc -->
    <path d="M 120 400 A 280 280 0 0 1 400 120" fill="none" stroke="url(#symGrad)" stroke-width="36" stroke-linecap="round" opacity="0.4" />
    <!-- Main Arc -->
    <path d="M 160 400 A 240 240 0 0 1 400 160" fill="none" stroke="url(#symGrad)" stroke-width="40" stroke-linecap="round" />
    <!-- Play Stream Prism -->
    <path d="M 210 210 L 370 305 L 210 400 Z" fill="url(#symGrad)" />
    <!-- Broadcast Dot -->
    <circle cx="160" cy="400" r="30" fill="#38BDF8" />
  </g>
</svg>
