<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logomark Container -->
  <g transform="translate(10, 10)">
    <rect width="100" height="100" rx="24" fill="#0F172A" stroke="#334155" stroke-width="2" />
    <g filter="url(#logoGlow)">
      <!-- Arc -->
      <path d="M 32 76 A 44 44 0 0 1 76 32" fill="none" stroke="url(#logoGrad)" stroke-width="8" stroke-linecap="round" />
      <!-- Play Prism -->
      <path d="M 44 42 L 72 58 L 44 74 Z" fill="url(#logoGrad)" />
      <!-- Base Dot -->
      <circle cx="32" cy="76" r="6" fill="#38BDF8" />
    </g>
  </g>

  <!-- Wordmark Text -->
  <g transform="translate(130, 25)">
    <!-- Brand Title -->
    <text x="0" y="48" fill="#F8FAFC" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="-1">CASTER</text>
    
    <!-- NAS / Server Pill Badge -->
    <rect x="200" y="16" width="58" height="24" rx="6" fill="url(#badgeGrad)" stroke="#38BDF8" stroke-width="1.5" />
    <text x="229" y="32.5" fill="#38BDF8" font-family="'Inter', monospace, sans-serif" font-weight="800" font-size="11" text-anchor="middle" letter-spacing="1">NAS</text>

    <!-- Subtitle -->
    <text x="2" y="70" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="12" letter-spacing="2">PERSONAL MEDIA SERVER</text>
  </g>
</svg>
