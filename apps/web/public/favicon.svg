<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="casterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Container with rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="128" stroke="#334155" stroke-width="8" opacity="0.4" />

  <!-- Radiating Cast Arcs -->
  <g filter="url(#glow)">
    <!-- Outer Arc -->
    <path d="M 128 384 A 256 256 0 0 1 384 128" fill="none" stroke="url(#casterGrad)" stroke-width="28" stroke-linecap="round" opacity="0.35" />
    <!-- Middle Arc -->
    <path d="M 160 384 A 192 192 0 0 1 352 192" fill="none" stroke="url(#casterGrad)" stroke-width="32" stroke-linecap="round" opacity="0.75" />
    <!-- Inner Cast Node / Play Prism -->
    <path d="M 200 216 L 332 292 L 200 368 Z" fill="url(#casterGrad)" />
    <!-- Cast Dot -->
    <circle cx="160" cy="384" r="24" fill="#38BDF8" />
  </g>
</svg>
