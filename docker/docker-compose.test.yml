services:
  caster:
    container_name: caster-test
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: caster:test
    restart: unless-stopped
    ports:
      - "${CASTER_BIND_ADDRESS:-0.0.0.0}:${CASTER_PORT:-3001}:3001"
    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
      MEDIA_DATA_DIR: /app/data
      THUMBNAILS_DIR: /app/data/thumbnails
      TRANSCODE_CACHE_DIR: /app/data/transcode_cache
      TRANSCODE_MAX_CONCURRENT: "${TRANSCODE_MAX_CONCURRENT:-2}"
      TRANSCODE_CACHE_MAX_AGE_HOURS: "${TRANSCODE_CACHE_MAX_AGE_HOURS:-24}"
      TRANSCODE_CACHE_MAX_SIZE_MB: "${TRANSCODE_CACHE_MAX_SIZE_MB:-10000}"
      TZ: "${TZ:-UTC}"
    volumes:
      - caster-test-data:/app/data
      - type: bind
        source: "${CASTER_MEDIA_PATH:-/mnt/tank/media}"
        target: /media
        read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  caster-test-data:
