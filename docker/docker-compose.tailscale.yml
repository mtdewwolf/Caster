services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-media
    hostname: caster-nas
    restart: unless-stopped
    environment:
      # Obtain an auth key from https://login.tailscale.com/admin/settings/keys
      - TS_AUTHKEY=${TS_AUTHKEY:?Set TS_AUTHKEY before starting Tailscale}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=--accept-routes
    volumes:
      - /mnt/tank/appdata/tailscale/state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  caster:
    container_name: caster
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: caster:latest
    restart: unless-stopped
    # Attach Caster directly into the Tailscale network namespace
    network_mode: "service:tailscale"
    depends_on:
      - tailscale
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - MEDIA_DATA_DIR=/app/data
      - THUMBNAILS_DIR=/app/data/thumbnails
      - TRANSCODE_CACHE_DIR=/app/data/transcode_cache
      - TRANSCODE_MAX_CONCURRENT=${TRANSCODE_MAX_CONCURRENT:-2}
      - TRANSCODE_CACHE_MAX_AGE_HOURS=${TRANSCODE_CACHE_MAX_AGE_HOURS:-24}
      - TRANSCODE_CACHE_MAX_SIZE_MB=${TRANSCODE_CACHE_MAX_SIZE_MB:-10000}
      # Tailscale uses 100.64.0.0/10, which must be explicitly allowed for
      # the one-time owner claim. This does not grant normal application access.
      - CASTER_SETUP_NETWORKS=100.64.0.0/10
      - TZ=America/New_York
    volumes:
      - /mnt/tank/appdata/caster/data:/app/data
      - /mnt/tank/media:/media:ro
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "107"
